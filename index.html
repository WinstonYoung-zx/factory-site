<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Advertising light box, guide sign, LED LCD screen, bus shelter & metal structure manufacturer for B2B export">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Header 导航 -->
<header class="site-header">
  <div class="container nav-wrap">
    <div class="logo-wrap">
      <img id="site-logo" alt="Logo">
      <span id="site-title"></span>
    </div>
    <nav class="main-nav">
      <a href="index.html" data-i18n="navHome"></a>
      <a href="products.html" data-i18n="navProducts"></a>
      <a href="about.html" data-i18n="navAbout"></a>
      <a href="contact.html" data-i18n="navContact"></a>
    </nav>
    <select class="lang-select">
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="ar">العربية</option>
      <option value="zh">中文</option>
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
    </select>
  </div>
</header>

<!-- Banner -->
<section class="banner">
  <div class="container banner-inner">
    <h1 data-i18n="bannerSlogan"></h1>
    <p data-i18n="bannerDesc"></p>

<!-- 三大优势 -->

      </div>
      <div class="feature-card">
        <h3 data-i18n="feat2Title"></h3>
        <p data-i18n="feat2Text"></p>
      </div>
      <div class="feature-card">
        <h3 data-i18n="feat3Title"></h3>
        <p data-i18n="feat3Text"></p>
      </div>
    </div>
  </div>
</section>

<!-- 产品预览区 -->
<section class="product-preview">
  <div class="container">
    <h2 data-i18n="productsTitle"></h2>
    <div class="product-grid">
      <!-- CMS产品卡片 -->
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <p>© 2026 Zhanxin Intelligent. All rights reserved.</p>
  </div>
</footer>

<!-- ========= 把lang.js放在body最底部，保证DOM全部渲染完成再执行 ========= -->
<script src="lang.js"></script>

<!-- 仅保留全局Logo读取脚本 -->
<script>
async function loadGlobalSetting(){
  try{
    const res = await fetch("content/global.md");
    const raw = await res.text();
    const parts = raw.split("---");
    const front = parts[1];
    const getField = (key)=>{
      const reg = new RegExp(`^${key}:\\s*(.+)$`,"m");
      const m = front.match(reg);
      return m ? m[1] : "";
    }
    const logoUrl = getField("siteLogo");
    const siteTitle = getField("siteTitle");
    if(logoUrl){
      document.getElementById("site-logo").src = logoUrl;
    }
    document.getElementById("site-title").textContent = siteTitle;
  }catch(e){
    console.log("全局配置读取失败",e);
  }
}
loadGlobalSetting();
</script>

</body>
</html>
