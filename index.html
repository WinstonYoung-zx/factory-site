<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shanghai ZhanXin Intelligent Equipment Co.,Ltd.</title>
  <meta name="description" content="Advertising light box, guide sign, LED LCD screen, bus shelter & metal structure manufacturer for B2B export">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Header 导航栏 -->
<header class="site-header">
  <div class="container nav-wrap">
    <div class="logo-wrap">
      <img id="site-logo" alt="Logo">
      <span id="site-title"></span>
    </div>
    <nav class="main-nav">
      <a href="index.html" data-i18n="navHome"></a>
      <a href="products.html" data-i18n="navProducts"></a>
      <a href="about.html" data-i18n="navAbout"></a>
      <a href="contact.html" data-i18n="navContact"></a>
    </nav>
    <select class="lang-select">
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="ar">العربية</option>
      <option value="zh">中文</option>
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
    </select>
  </div>
</header>

<!-- Banner 首页轮播 -->
<section class="banner">
  <div class="container banner-inner">
    <h1 data-i18n="bannerSlogan"></h1>
    <p data-i18n="bannerDesc"></p>
    <a href="contact.html" class="btn-primary" data-i18n="inquiryBtn"></a>
  </div>
</section>

<!-- 三大优势模块 -->
<section class="features">
  <div class="container">
    <h2 data-i18n="productsTitle"></h2>
    <div class="feature-grid">
      <div class="feature-card">
        <h3 data-i18n="feat1Title"></h3>
        <p data-i18n="feat1Text"></p>
      </div>
      <div class="feature-card">
        <h3 data-i18n="feat2Title"></h3>
        <p data-i18n="feat2Text"></p>
      </div>
      <div class="feature-card">
        <h3 data-i18n="feat3Title"></h3>
        <p data-i18n="feat3Text"></p>
      </div>
    </div>
  </div>
</section>

<!-- 产品预览区，可自行调整 -->
<section class="product-preview">
  <div class="container">
    <h2 data-i18n="productsTitle"></h2>
    <div class="product-grid">
      <!-- 产品卡片由Decap CMS动态渲染，这里仅占位 -->
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <p>© 2026 Shanghai ZhanXin Intelligent Equipment Co.,Ltd. All rights reserved.</p>
  </div>
</footer>

<!-- JS引入 -->
<script src="lang.js"></script>
<script>
// ========== 读取全局设置 global.md（Logo+网站标题）==========
async function loadGlobalSetting(){
  try{
    const res = await fetch("content/global.md");
    const raw = await res.text();
    const parts = raw.split("---");
    const front = parts[1];
    const getField = (key)=>{
      const reg = new RegExp(`^${key}:\\s*(.+)$`,"m");
      const m = front.match(reg);
      return m ? m[1] : "";
    }
    const logoUrl = getField("siteLogo");
    const siteTitle = getField("siteTitle");
    if(logoUrl){
      document.getElementById("site-logo").src = logoUrl;
    }
    document.getElementById("site-title").textContent = siteTitle;
  }catch(e){
    console.log("全局配置读取失败",e);
  }
}

// ========== 【修复undefined】读取首页home.md内容 ==========
async function loadHomeContent(){
  try{
    const res = await fetch("content/home.md");
    const raw = await res.text();
    const sections = raw.split("---");
    const frontMatter = sections[1];

    const getField = (fieldName) => {
      const regExp = new RegExp(`^${fieldName}:\\s*(.+)$`, "m");
      const result = frontMatter.match(regExp);
      return result ? result[1] : "";
    }

    const heroTitle = getField("heroTitle");
    const heroDesc = getField("heroDesc");
    const adv1Title = getField("adv1Title");
    const adv1Text = getField("adv1Text");
    const adv2Title = getField("adv2Title");
    const adv2Text = getField("adv2Text");
    const adv3Title = getField("adv3Title");
    const adv3Text = getField("adv3Text");

    document.querySelector(".banner h1").textContent = heroTitle;
    document.querySelector(".banner p").textContent = heroDesc;

    const cards = document.querySelectorAll(".feature-card");
    cards[0].querySelector("h3").textContent = adv1Title;
    cards[0].querySelector("p").textContent = adv1Text;
    cards[1].querySelector("h3").textContent = adv2Title;
    cards[1].querySelector("p").textContent = adv2Text;
    cards[2].querySelector("h3").textContent = adv3Title;
    cards[2].querySelector("p").textContent = adv3Text;
  }catch(error){
    console.error("首页内容加载失败：",error);
  }
}

// 页面加载执行
document.addEventListener("DOMContentLoaded",function(){
  loadGlobalSetting();
  loadHomeContent();
})
</script>
</body>
</html>
