backend:
  name: git-gateway
  branch: main

# 图片上传目录
media_folder: "uploads"
public_folder: "/uploads"

# CMS 内容集合定义
collections:
  # 网站全局设置：Logo、站点名称
  - name: "global"
    label: "网站全局设置"
    file: "content/global.md"
    fields:
      - {label: "网站Logo", name: "siteLogo", widget: "image"}
      - {label: "网站标题", name: "siteTitle", widget: "string"}

  # 产品管理，支持后台新增产品分类 allow_add: true
  - name: "products"
    label: "产品管理"
    folder: "content/products"
    create: true
    fields:
      - {label: "产品名称", name: "title", widget: "string"}
      - {label: "产品图片", name: "image", widget: "image"}
      - label: "产品分类"
        name: "category"
        widget: "select"
        options:
          - {label: "Lightbox 广告灯箱", value: "lightbox"}
          - {label: "Sign 导向标识", value: "sign"}
          - {label: "Bus 候车亭", value: "bus"}
          - {label: "Display 显示屏", value: "display"}
          - {label: "Metal Structure 金属结构", value: "metal-structure"}
          - {label: "Other 其它", value: "other"}
        allow_add: true
      - {label: "产品简介", name: "desc", widget: "markdown"}

  # 关于我们页面
  - name: "about"
    label: "关于我们页面"
    file: "content/about.md"
    fields:
      - {label: "公司介绍", name: "intro", widget: "markdown"}
      - {label: "质检与生产流程", name: "qc", widget: "markdown"}
      - {label: "资料与项目配套支持", name: "cert", widget: "markdown"}

  # 联系我们页面
  - name: "contact"
    label: "联系页面信息"
    file: "content/contact.md"
    fields:
      - {label: "联系信息", name: "info", widget: "markdown"}
      - {label: "询盘表单提示文字", name: "formTip", widget: "string"}
