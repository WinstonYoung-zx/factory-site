backend:
  name: github
  repo: WinstonYoung-zx/factory-site
  branch: main

media_library:
  name: media_folder

media_folder: "uploads"
public_folder: "/uploads"

locale: en

collections:
  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Product Name", name: "name", widget: "string"}
      - {label: "Product Image", name: "image", widget: "image"}
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Lightbox", value: "lightbox" }
          - { label: "Sign", value: "sign" }
          - { label: "Bus", value: "bus" }
          - { label: "Display", value: "display" }
          - { label: "Metal Structure", value: "metal-structure" }
          - { label: "Other", value: "other" }
        allow_add: true
      - {label: "Short Description", name: "short_desc", widget: "text"}
      - {label: "Full Description", name: "description", widget: "markdown"}
      - {label: "Specification", name: "spec", widget: "markdown"}
      - {label: "Sort Order", name: "sort", widget: "number", default: 10}
      - {label: "Published", name: "published", widget: "boolean", default: true}

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Home Page"
        name: "home"
        file: "content/home.json"
        fields:
          - {label: "Hero Title", name: "hero_title", widget: "string"}
          - {label: "Hero Slogan", name: "hero_slogan", widget: "string"}
          - label: "Advantages"
            name: "advantages"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "desc", widget: "text"}
