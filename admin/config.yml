backend:
  name: git-gateway
  repo: WinstonYoung-zx/factory-site
  branch: main
  api_root: https://cms-gateway.shzxin-cn.workers.dev/api
media_folder: "uploads"
public_folder: "/uploads"
locale: en

collections:
  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Product Name", name: "title", widget: "string"}
      - {label: "Product Image", name: "image", widget: "image"}
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Light Box", value: "lightbox" }
          - { label: "Sign", value: "sign" }
          - { label: "Bus Shelter", value: "bus" }
          - { label: "Display Screen", value: "display" }
          - { label: "Metal Structure", value: "metal-structure" }
          - { label: "Other", value: "other" }
        allow_add: true
      - {label: "Description", name: "description", widget: "markdown"}
      - {label: "Price Info", name: "price", widget: "string", required: false}
      - {label: "Specifications", name: "spec", widget: "text", required: false}

  - name: "pages"
    label: "Site Pages"
    files:
      - label: "Homepage"
        name: "home"
        file: "content/home.md"
        fields:
          - {label: "Page Title", name: "title", widget: "string"}
          - {label: "Hero Slogan", name: "slogan", widget: "string"}
          - {label: "Intro Text", name: "intro", widget: "markdown"}
