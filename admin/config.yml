backend:
  name: github
  repo: WinstonYoung-zx/factory-site
  branch: main
media_folder: "uploads"
public_folder: "/uploads"
# 产品合集，分类下拉支持预设+手动新增 allow_add: true
collections:
  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    fields:
      - {label: "Product Name", name: "name", widget: "string"}
      - {label: "Category", name: "category", widget: "select", options: ["lightbox","sign","bus","display","metal-structure","other"], allow_add: true}
      - {label: "Product Image", name: "image", widget: "image"}
      - {label: "Short Description", name: "short_desc", widget: "string"}
      - {label: "Full Description", name: "description", widget: "markdown"}
  # 首页内容管理
  - name: "home"
    label: "Home Page"
    file: "content/home.md"
    create: false
    fields:
      - {label: "Hero Title", name: "title", widget: "string"}
      - {label: "Hero Slogan", name: "slogan", widget: "string"}
      - {label: "Banner Image", name: "banner", widget: "image"}
      - {label: "Advantage 1", name: "adv1", widget: "string"}
      - {label: "Advantage 2", name: "adv2", widget: "string"}
      - {label: "Advantage 3", name: "adv3", widget: "string"}
  # 工厂实力 / About页面
  - name: "about"
    label: "About Us"
    file: "content/about.md"
    create: false
    fields:
      - {label: "Page Title", name: "title", widget: "string"}
      - {label: "Factory Intro", name: "intro", widget: "markdown"}
      - {label: "Factory Images", name: "gallery", widget: "list", field: {label: "Image", name: "img", widget: "image"}}
  # 全局站点设置（Logo、联系信息）
  - name: "global"
    label: "Global Site Settings"
    file: "content/global.md"
    create: false
    fields:
      - {label: "Website Logo", name: "logo", widget: "image"}
      - {label: "Company Name", name: "company", widget: "string"}
      - {label: "Email", name: "email", widget: "string"}
      - {label: "WhatsApp", name: "whatsapp", widget: "string"}
