backend:
  name: github
  repo: WinstonYoung-zx/factory-site
  branch: main
  base_url: https://cms-gateway.shzxin-cn.workers.dev

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    fields:
      - {label: "Product Name", name: "title", widget: "string"}
      - {label: "Category", name: "category", widget: "select", options: ["lightbox", "sign", "bus", "display", "metal-structure", "other"], allow_add: true}
      - {label: "Cover Image", name: "image", widget: "image"}
      - {label: "Short Description", name: "desc", widget: "text"}
      - {label: "Details", name: "body", widget: "markdown"}

  - name: "pages"
    label: "Site Pages"
    folder: "content/pages"
    create: false
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Content", name: "body", widget: "markdown"}

  - name: "settings"
    label: "Website Settings"
    files:
      - label: "Global Site Config"
        name: "global"
        file: "content/settings/global.yml"
        fields:
          - {label: "Site Title", name: "site_title", widget: "string"}
          - {label: "Meta Description", name: "site_desc", widget: "text"}

  - name: "inquiry"
    label: "Inquiry Messages"
    folder: "content/inquiry"
    create: true
    fields:
      - {label: "Company", name: "company", widget: "string"}
      - {label: "Contact Name", name: "name", widget: "string"}
      - {label: "Email", name: "email", widget: "string"}
      - {label: "Product Interest", name: "product", widget: "string"}
      - {label: "Message", name: "msg", widget: "text"}
