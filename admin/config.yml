backend:
  name: git-gateway
  branch: main
media_folder: "uploads"
public_folder: "/uploads"
locale: en
collections:
  # === 新增：网站全局设置（Logo + 网站标题）===
  - name: "global"
    label: "网站全局设置"
    files:
      - name: "global"
        label: "全局信息"
        file: "content/global.md"
        fields:
          - {label: "网站Logo图片", name: "site_logo", widget: "image"}
          - {label: "网站标题(顶部文字)", name: "site_title", widget: "string"}
          - {label: "首页标语", name: "slogan", widget: "string"}

  # === 下面全部是你原来已有的配置，原样保留 ===
  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Product Name", name: "title", widget: "string"}
      - label: "Category"
        name: "category"
        widget: "select"
        allow_add: true
        options:
          - { label: "Advertising Light Box", value: "lightbox" }
          - { label: "Wayfinding Signage", value: "sign" }
          - { label: "LED / LCD Screen", value: "display" }
          - { label: "Bus Shelter", value: "bus" }
          - { label: "Custom Steel & Aluminum Structure", value: "custom-steel-aluminum" }
          - { label: "Others", value: "other" }
      - {label: "Cover Image", name: "image", widget: "image"}
      - {label: "Material & Spec", name: "spec", widget: "text"}
      - {label: "Short Description", name: "desc", widget: "text"}

  - name: "homepage"
    label: "Home Page Content"
    files:
      - file: "content/home.md"
        label: "Home"
        name: "home"
        fields:
          - {label: "Hero Title", name: "heroTitle", widget: "string"}
          - {label: "Hero Description", name: "heroDesc", widget: "text"}
          - {label: "Advantage 1 Title", name: "adv1Title", widget: "string"}
          - {label: "Advantage 1 Text", name: "adv1Text", widget: "text"}
          - {label: "Advantage 2 Title", name: "adv2Title", widget: "string"}
          - {label: "Advantage 2 Text", name: "adv2Text", widget: "text"}
          - {label: "Advantage 3 Title", name: "adv3Title", widget: "string"}
          - {label: "Advantage 3 Text", name: "adv3Text", widget: "text"}

  - name: "aboutpage"
    label: "About Page Content"
    files:
      - file: "content/about.md"
        label: "About Us"
        name: "about"
        fields:
          - {label: "Company Intro", name: "intro", widget: "markdown"}
          - {label: "QC Process", name: "qc", widget: "markdown"}
          - {label: "Cert & OEM Info", name: "cert", widget: "markdown"}
