backend:
  name: file-system
media_folder: "uploads"
public_folder: "/uploads"
locale: en
site_url: "https://www.zhanxinglobal.com"

collections:
  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Product Name", name: "title", widget: "string"}
      - {label: "Product Image", name: "image", widget: "image"}
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Light Box", value: "lightbox" }
          - { label: "Sign", value: "sign" }
          - { label: "Bus Shelter", value: "bus" }
          - { label: "Display Screen", value: "display" }
          - { label: "Metal Structure", value: "metal-structure" }
          - { label: "Other", value: "other" }
        allow_add: true
      - {label: "Description", name: "description", widget: "markdown"}
      - {label: "Price Info", name: "price", widget: "string", required: false}
      - {label: "Specifications", name: "spec", widget: "text", required: false}

  - name: "pages"
    label: "Site Pages"
    files:
      - label: "Homepage"
        name: "homepage"
        file: "content/home.md"
        fields:
          - {label: "Hero Title", name: "title", widget: "string"}
          - {label: "Hero Subtitle", name: "subtitle", widget: "string"}
          - {label: "Banner Image", name: "banner", widget: "image"}
          - {label: "Advantage 1", name: "adv1", widget: "string"}
          - {label: "Advantage 2", name: "adv2", widget: "string"}
          - {label: "Advantage 3", name: "adv3", widget: "string"}
