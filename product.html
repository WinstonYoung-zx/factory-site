<link rel="alternate" hreflang="es" href="https://www.zhanxinglobal.com/product.html">

<link rel="alternate" hreflang="de" href="https://www.zhanxinglobal.com/product.html">

<style>
:root{
  --primary:#0F2A44;
  --accent:#ff7800;
  --light:#f8f9fa;
  --dark:#222;
  --border-gray:#D9DEE3;
  --footer-bg:#0B1F33;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
body{color:var(--dark);background:#fff;}

/* 导航栏 全站统一 */
header{
  background-color: var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:1rem 5%;
  flex-wrap:wrap;
  gap:1rem;
}
.header-logo-wrap{
  display:flex;
  align-items:center;
}
#site-logo{
  height:48px;
  width:auto;
  object-fit:contain;
}
nav{
  display:flex;
  gap:2rem;
  flex-wrap:wrap;
}
nav a{
  color:#ffffff;
  text-decoration:none;
  transition:color 0.2s;
}
nav a:hover{
  color:var(--accent);
}
nav a.active{
  border-bottom:2px solid var(--accent);
  padding-bottom:4px;
}
.lang-select{
  padding:4px 8px;
  border-radius:4px;
  border:none;
}
select,
select option {
  color: #222 !important;
  background: #ffffff !important;
}
select option:hover,
select option:focus {
  background-color: #0F2A44 !important;
  color: #fff !important;
}

/*面包屑 */
.breadcrumb{
  padding:1.2rem 5%;
  background:#f7f8fa;
  font-size:0.9rem;
}
.breadcrumb a{
  color:var(--primary);
  text-decoration:none;
}
.breadcrumb span{
  margin:0 6px;color:#888;
}

/*详情主容器 */
.detail-wrap{
  max-width:1400px;
  margin:0 auto;
  padding:2.5rem 5%;
}
.detail-grid{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:2.5rem;
  align-items:start;
}
.detail-img-box{
  border:1px solid var(--border-gray);
  border-radius:12px;
  overflow:hidden;
  background:#f1f3f6;
}
.detail-img-box img{
  width:100%;
  height:auto;
  display:block;
}
.detail-info h1{
  font-size:2rem;
  color:var(--primary);
  margin-bottom:1rem;
  line-height:1.3;
}
.detail-meta{
  border:1px solid var(--border-gray);
  border-radius:10px;
  padding:1.4rem;
  margin-bottom:1.6rem;
  background:#fff;
}
.detail-meta p{
  margin-bottom:0.6rem;
  line-height:1.6;
}
.detail-desc{
  line-height:1.75;
  color:#444;
  margin-bottom:2rem;
  font-size:1.02rem;
}
.btn-group{
  display:flex;
  gap:1rem;
  flex-wrap:wrap;
}
.btn-back{
  display:inline-block;
  padding:11px 20px;
  border:1px solid var(--border-gray);
  border-radius:8px;
  text-decoration:none;
  color:var(--primary);
  transition:0.24s ease;
}
.btn-back:hover{
  background:#f7f8fa;
}
.btn-inquiry{
  display:inline-block;
  padding:11px 24px;
  background:var(--accent);
  color:#fff;
  border-radius:8px;
  text-decoration:none;
  transition:0.24s ease;
}
.btn-inquiry:hover{
  opacity:0.92;
}

/*状态提示 */
.loading-tip{
  text-align:center;padding:5rem 0;color:#555;font-size:1.1rem;
}
.error-tip{
  text-align:center;padding:5rem 0;color:#c0392b;font-size:1.1rem;
}

/*悬浮询盘按钮 */
.float-inquiry{
  position:fixed;
  right:20px;
  bottom:30px;
  background:var(--accent);
  color:#fff;
  padding:12px 18px;
  border-radius:50px;
  text-decoration:none;
  box-shadow:0 4px 12px rgba(255,120,0,0.35);
  z-index:99;
}
.float-inquiry:hover{
  opacity:0.92;
}

footer{
  background:var(--footer-bg);
  color:#cccccc;
  text-align:center;
  padding:2.2rem 5%;
  margin-top:5rem;
}
footer a{
  color:#ffb040;
  text-decoration:none;
}
footer a:hover{
  text-decoration:underline;
}

/*RTL阿拉伯语 */
[dir="rtl"] .breadcrumb,
[dir="rtl"] .detail-info{
  text-align:right;
}
[dir="rtl"] .btn-group{
  flex-direction:row‑reverse;
}

@media(max-width:992px){
  .detail-grid{
    grid-template-columns:1fr;
  }
}
@media(max-width:768px){
  header{flex-direction:column;align-items:flex-start;}
  nav{gap:1rem;width:100%;justify-content:flex-start;}
  .detail-wrap{padding:1.8rem 3%;}
  .float-inquiry{right:15px;bottom:20px;font-size:0.9rem;padding:10px 16px;}
}
</style>
</head>

  <div class="header-logo-wrap">
    <img id="site-logo" src="/uploads/logo.png" data-i18n-alt="site.logoAlt" alt="Shanghai ZhanXin Intelligent Equipment Co.,Ltd." width="180" height="48">
  </div>
  <nav>
    <a href="index.html" data-i18n="nav.home">Home</a>

  <select class="lang-select" id="langSelect">
    <option value="en">English</option>
    <option value="zh">中文</option>
    <option value="es">Español</option>
    <option value="fr">Français</option>
    <option value="de">Deutsch</option>
    <option value="ja">日本語</option>
    <option value="ar">العربية</option>
  </select>
</header>

<div class="breadcrumb">
  <a href="index.html" data-i18n="breadcrumb.home">Home</a>
  <span>›</span>
  <a href="products.html" data-i18n="breadcrumb.products">Our Products</a>
  <span>›</span>
  <span id="breadProductName">-</span>

<div class="detail-wrap">

<footer>
  <p data-i18n="footer.copyright">© 2026 SHANGHAI ZHANXIN INTELLIGENT EQUIPMENT CO.,LTD. All rights reserved. <a href="privacy.html">Privacy Policy</a></p>
</footer>

<script src="lang.js" defer></script>
<script defer>
//读取全局配置 global.md
async function loadGlobalConfig() {
  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), 6000);
  try{
    const res = await fetch("content/global.md", {signal:controller.signal});
    clearTimeout(timeoutId);
    if(!res.ok) throw new Error("global.md not found");
    const raw = await res.text();
    const match = raw.match(/---\n([\s\S]*?)\n---/);
    if(!match) throw new Error("front‑matter parse error");
    const front = match[1];
    const logoMatch = front.match(/site_logo:\s*(.*)/);
    if(logoMatch) document.getElementById("site-logo").src = logoMatch[1].trim();
  }catch(e){
    clearTimeout(timeoutId);
    console.log("全局配置读取失败", e);
  }
}
loadGlobalConfig();
</script>

<script defer>
function escapeHtml(str){
  if(!str) return "";
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

// 获取url上slug参数
function getUrlSlug(){
  const params = new URLSearchParams(window.location.search);
  return params.get("slug") || null;
}

// 更新Product结构化JSON‑LD
function updateProductSchema(product){
  const schemaEl = document.getElementById("productSchema");
  const schema = JSON.parse(schemaEl.textContent);
  schema.name = product.title || "";
  schema.description = product.desc || "";
  schema.image = product.image || "";
  schemaEl.textContent = JSON.stringify(schema);
}

async function renderProduct(){
  const pageContent = document.getElementById("pageContent");
  const slug = getUrlSlug();
  if(!slug){
    pageContent.className="error‑tip";
    pageContent.innerHTML = `<p data‑i18n="product.noSlug">Missing product identifier. <br><a href="products.html">← Back to product list</a></p>`;
    if(window.setLang && window.currentLang) window.setLang(window.currentLang);
    return;
  }

  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(),6000);
  let productList;
  try{
    const res = await fetch("content/product‑index.json", {signal:controller.signal});
    clearTimeout(timeoutId);
    if(!res.ok) throw new Error("json not found");
    productList = await res.json();
  }catch(err){
    clearTimeout(timeoutId);
    console.log("产品json读取异常",err);
    pageContent.className="error‑tip";
    pageContent.innerHTML=`<p data‑i18n="product.loadFail">Failed to load product data. <br><a href="products.html">← Back to product list</a></p>`;
    if(window.setLang && window.currentLang) window.setLang(window.currentLang);
    return;
  }

  //匹配slug
  const findProduct = productList.find(p=>{
    const pSlug = p.slug || (p.title||"").toLowerCase().replace(/\s+/g,"-");
    return pSlug === slug;
  });

  if(!findProduct){
    pageContent.className="error‑tip";
    pageContent.innerHTML = `<p data‑i18n="product.notFound">This product does not exist. <br><a href="products.html">← Back to product list</a></p>`;
    if(window.setLang && window.currentLang) window.setLang(window.currentLang);
    return;
  }

  const item = findProduct;
  updateProductSchema(item);
  document.getElementById("breadProductName").innerText = escapeHtml(item.title);

  //渲染详情页面
  const imgSrc = escapeHtml(item.image||"");
  const title = escapeHtml(item.title||"");
  const desc = escapeHtml(item.desc||"");
  const cat = escapeHtml(item.category||"‑");

  pageContent.className="";
  pageContent.innerHTML = `
    <div class="detail-grid">
      <div class="detail-img-box">
        <img src="${imgSrc}" alt="${title}" loading="lazy" onerror="this.style.display='none'">
      </div>
      <div class="detail-info">
        <h1>${title}</h1>
        <div class="detail‑meta">
          <p><strong data‑i18n="product.categoryLabel">Category:</strong> ${cat}</p>
        </div>
        <div class="detail‑desc">${desc}</div>
        <div class="btn-group">
          <a href="products.html" class="btn‑back" data‑i18n="product.btnBack">← Back to list</a>
          <a href="index.html#inquiry" class="btn‑inquiry" data‑i18n="product.btnInquiry">Send Inquiry</a>
        </div>
      </div>
    </div>
  `;
  //触发多语言翻译刷新
  if(window.setLang && window.currentLang) window.setLang(window.currentLang);
}

renderProduct();
</script>
