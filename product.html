}
.lang-select{

}

.breadcrumb{

}
.breadcrumb a{color:var(--primary);text-decoration:none;}
.breadcrumb span{margin:0 6px;color:#888;}
.container{

  padding:3rem 5%;
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:3rem;
}
.img-box img{

}
.info-box h1{

}
.info-box .cate{

  border-radius:20px;
  font-size:0.9rem;
  margin-bottom:1.5rem;
}
.info-box p{

}
.btn-inquiry{

  background:var(--accent);
  color:#fff;
  padding:14px 28px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}
.loading, .error{

  padding:6rem 0;
  font-size:1.1rem;
}
.error{color:#c0392b;}
footer{

  color:#cccccc;

footer a{color:#ffb040;text-decoration:none;}

@media(max-width:768px){

let currentLang = localStorage.getItem("preferredLang") || "en";
const langSelect = document.getElementById("langSelect");
function escapeHtml(str){
  if(!str) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
const urlParams = new URLSearchParams(window.location.search);
const slug = urlParams.get("slug");
const box = document.getElementById("detailBox");
async function loadDetail(){
  try{
    const res = await fetch("/content/product-index.json");
    if(!res.ok) throw new Error();
    const list = await res.json();
    const item = list.find(p=>(p.slug || p.title?.en?.toLowerCase().replace(/\s+/g,"-")) === slug);
    if(!item){
      box.innerHTML = `<div class="error" data-i18n="detail.error">Product not found</div>`;
      return;
    }
    const title = item.title?.[currentLang] || item.title?.en || "";
    const desc = item.desc?.[currentLang] || item.desc?.en || "";
    const showCategory = categoryI18n[currentLang][item.category] || item.category;
    const imgSrc = (item.image || "/uploads/placeholder.jpg") + "?v=20261020";

    // 动态更新 SEO meta 标签
    document.title = title + " | ZHANXIN";
    document.querySelector('link[rel="canonical"]').href = "https://www.zhanxinglobal.com/product?slug=" + slug;
    document.querySelector('meta[name="description"]').content = desc.substring(0, 160);
    document.querySelector('meta[property="og:title"]').content = title;
    document.querySelector('meta[property="og:description"]').content = desc.substring(0, 160);
    document.querySelector('meta[property="og:url"]').content = "https://www.zhanxinglobal.com/product?slug=" + slug;
    document.querySelector('meta[property="og:image"]').content = "https://www.zhanxinglobal.com" + (item.image || "/uploads/placeholder.jpg");
    document.querySelector('meta[name="twitter:title"]').content = title;
    document.querySelector('meta[name="twitter:description"]').content = desc.substring(0, 160);
    document.querySelector('meta[name="twitter:image"]').content = "https://www.zhanxinglobal.com" + (item.image || "/uploads/placeholder.jpg");

    box.innerHTML = `
      <div class="img-box">
        <img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(title)}" onerror="this.src='https://via.placeholder.com/800x600?text=No+Image'">
      </div>
      <div class="info-box">
        <h1>${escapeHtml(title)}</h1>
        <span class="cate">${escapeHtml(showCategory)}</span>
        <p>${escapeHtml(desc)}</p>
        <a href="/contact" class="btn-inquiry" data-i18n="detail.inquiry">Send Inquiry Now</a>
      </div>
    `;

    // GA4 跟踪产品详情页 Send Inquiry 按钮点击
    document.querySelector('.btn-inquiry')?.addEventListener('click', function() {
        gtag('event', 'inquiry_click', {
            'event_category': 'button_click',
            'event_label': 'product_detail_' + slug
        });
    });

    // 动态生成 Product 结构化数据
    const productLd = {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": title,
        "description": desc,
        "image": "https://www.zhanxinglobal.com" + (item.image || "/uploads/placeholder.jpg"),
        "url": "https://www.zhanxinglobal.com/product?slug=" + slug,
        "category": showCategory,
        "manufacturer": {
            "@type": "Organization",
            "name": "ZHANXIN",
            "url": "https://www.zhanxinglobal.com"
        }
    };
    // 移除旧的 JSON-LD（如果有）
    const oldLd = document.getElementById('product-jsonld');
    if(oldLd) oldLd.remove();
    // 插入新的 JSON-LD
    const scriptLd = document.createElement('script');
    scriptLd.type = 'application/ld+json';
    scriptLd.id = 'product-jsonld';
    scriptLd.textContent = JSON.stringify(productLd);
    document.head.appendChild(scriptLd);
  }catch(err){
    box.innerHTML = `<div class="error" data-i18n="detail.error">Product not found</div>`;
  }
}
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem("preferredLang", lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if(translations[lang][k]) el.textContent = translations[lang][k];
  });
  document.querySelectorAll("[data-i18n-alt]").forEach(el=>{
    const k = el.getAttribute("data-i18n-alt");
    if(translations[lang][k]) el.alt = translations[lang][k];
  });
  langSelect.value = lang;
  loadDetail();
}
langSelect.addEventListener("change", ()=>setLang(langSelect.value));
setLang(currentLang);
