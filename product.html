let currentLang = localStorage.getItem("preferredLang") || "en";
const langSelect = document.getElementById("langSelect");

// 【重点：把loadDetail函数提前定义，解决is not defined报错】
function escapeHtml(str){
  if(!str) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
const urlParams = new URLSearchParams(window.location.search);
const slug = urlParams.get("slug");
const box = document.getElementById("detailBox");

async function loadDetail(){
  try{
    const res = await fetch("content/product-index.json");
    if(!res.ok) throw new Error();
    const list = await res.json();
    const item = list.find(p=>(p.slug || p.title?.en?.toLowerCase().replace(/\s+/g,"-")) === slug);
    if(!item){
      box.innerHTML = `<div class="loading" data-i18n="detail.error">Product not found</div>`;
      return;
    }
    const title = item.title?.[currentLang] || item.title?.en || "";
    const desc = item.desc?.[currentLang] || item.desc?.en || "";
    const showCategory = categoryI18n[currentLang][item.category] || item.category;
    const imgSrc = item.image || "/uploads/placeholder.jpg";
    box.innerHTML = `
    <div class="product-row">
      <div class="img-box">
        <img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(title)}" onerror="this.src='https://via.placeholder.com/800x600?text=No+Image'">
      </div>
      <div class="info-box">
        <h1>${escapeHtml(title)}</h1>
        <span class="cate">${escapeHtml(showCategory)}</span>
        <p>${escapeHtml(desc)}</p>
        <a href="contact.html" class="btn primary" data-i18n="detail.inquiry">Send Inquiry Now</a>
      </div>
    </div>
    `;
  }catch(err){
    box.innerHTML = `<div class="loading" data-i18n="detail.error">Product not found</div>`;
  }
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem("preferredLang", lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if(translations[lang][k]) el.textContent = translations[lang][k];
  });
  document.querySelectorAll("[data-i18n-alt]").forEach(el=>{
    const k = el.getAttribute("data-i18n-alt");
    if(translations[lang][k]) el.alt = translations[lang][k];
  });
  langSelect.value = lang;
  loadDetail();
}

langSelect.addEventListener("change", ()=>setLang(langSelect.value));
setLang(currentLang);
