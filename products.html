<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Your Factory</title>
  <style>
    :root{--primary:#0F3460;--accent:#ff7800;--light:#f8f9fa;--dark:#222}
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
    body{color:var(--dark);background:#fff;}
    .product-wrap{padding:3rem 5%;max-width:1400px;margin:0 auto;}
    .product-wrap h2{text-align:center;font-size:2rem;margin-bottom:2rem;color:var(--primary);}
    .filter-box{text-align:center;margin-bottom:2rem;}
    #categoryFilter{padding:8px 12px;font-size:1rem;min-width:260px;}
    .product-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(280px,1fr));gap:2rem;}
    .product-card{border:1px solid #eee;border-radius:8px;overflow:hidden;}
    .product-card img{width:100%;height:200px;object-fit:cover;}
    .card-body{padding:1rem;}
    footer{background:#111;color:#fff;text-align:center;padding:2rem 5%;margin-top:4rem;}
    footer a{color:#fff;}
  </style>
</head>
<body>
<!-- 新版导航栏 Logo+文字 -->
<header style="display:flex;align-items:center;justify-content:space-between;padding:1rem 5%;border-bottom:1px solid #eee;flex-wrap:wrap;gap:1rem;">
  <div style="display:flex;align-items:center;gap:0.8rem;">
    <img id="site-logo" src="/uploads/logo.png" alt="logo" style="height:36px;object-fit:contain;">
    <div id="site-title" style="font-size:1.4rem;font-weight:bold;color:#0F3460;">YOURFACTORY</div>
  </div>
  <nav style="display:flex;gap:2rem;flex-wrap:wrap;">
    <a href="index.html" style="text-decoration:none;color:#333;">Home</a>
    <a href="products.html" style="text-decoration:none;color:#333;">Products</a>
    <a href="about.html" style="text-decoration:none;color:#333;">About Us</a>
    <a href="contact.html" style="text-decoration:none;color:#333;">Contact</a>
  </nav>
  <select class="lang-select" style="padding:4px 8px;border:1px solid #ccc;border-radius:4px;">
    <option value="en">English</option>
    <option value="es">Español</option>
    <option value="ar">العربية</option>
    <option value="zh">中文</option>
  </select>
</header>

<div class="product-wrap">
  <h2 data-i18n="ourProducts">Our Products</h2>
  <div class="filter-box">
    <select id="categoryFilter">
      <option value="" data-i18n="allCategories">All Categories</option>
    </select>
  </div>
  <div class="product-grid" id="productGrid"></div>
</div>

<footer>
  <p>© 2026 Your Factory. All rights reserved. <a href="privacy.html">Privacy Policy</a></p>
</footer>

<script src="lang.js"></script>
<script>
//读取全局配置：Logo + 网站标题
async function loadGlobalConfig() {
  try{
    const res = await fetch("content/global.md");
    const raw = await res.text();
    const front = raw.match(/---\n([\s\S]*?)\n---/)[1];
    //提取logo图片路径
    const logoSrc = front.match(/site_logo: (.*)/)[1];
    document.getElementById("site-logo").src = logoSrc;
    //提取网站标题文字
    const siteTitle = front.match(/site_title: (.*)/)[1];
    document.getElementById("site-title").innerText = siteTitle;
  }catch(e){
    console.log("全局配置读取失败",e);
  }
}
loadGlobalConfig();
</script>
<script>
// 读取产品json渲染 + 分类筛选，增加异常捕获
let allProducts = [];
const categoryMap = {
  "lightbox":"Advertising Light Box",
  "sign":"Wayfinding Signage",
  "display":"LED / LCD Screen",
  "bus":"Bus Shelter",
  "metal-structure":"Metal Structure",
  "other":"Others"
};

async function loadProducts(){
  try {
    const res = await fetch("content/product-index.json");
    if (!res.ok) throw new Error("File not found");
    allProducts = await res.json();
    renderFilter();
    renderProducts(allProducts);
  } catch(err) {
    console.log("产品数据加载失败", err);
    const grid = document.getElementById("productGrid");
    grid.innerHTML = "<p style='text-align:center; color:red;'>Product data load failed. Check product-index.json</p>";
  }
}
function renderFilter(){
  const sel = document.getElementById("categoryFilter");
  Object.entries(categoryMap).forEach(([val,label])=>{
    const opt = document.createElement("option");
    opt.value = val;
    opt.innerText = label;
    sel.appendChild(opt);
  });
  sel.onchange = function(){
    const v = this.value;
    if(!v) renderProducts(allProducts);
    else renderProducts(allProducts.filter(p=>p.category===v));
  }
}
function renderProducts(list){
  const grid = document.getElementById("productGrid");
  grid.innerHTML="";
  if(!list || list.length === 0){
    grid.innerHTML = "<p style='text-align:center'>No products found</p>";
    return;
  }
  list.forEach(item=>{
    const card = document.createElement("div");
    card.className="product-card";
    card.innerHTML = `
      <img src="${item.image}" alt="${item.title}">
      <div class="card-body">
        <h3>${item.title}</h3>
        <p>${item.desc}</p>
      </div>
    `;
    grid.appendChild(card);
  })
}
loadProducts();
</script>
</body>
</html>
